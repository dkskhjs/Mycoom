<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>스팀 &amp; 빈즈</title>
<link rel="stylesheet" href="css/style.css">

<!-- 1. Firebase 라이브러리 (기존 js 파일보다 먼저 로드되어야 함) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">⚙ 스팀 &amp; 빈즈</div>
    <div class="stat" title="돈"><span id="coinIcon" class="ico"></span><b id="money">0</b></div>
    <div class="stat" title="석탄"><span class="ico">⚫</span><b id="coal">0</b></div>
    <div class="stat" title="평판"><b id="rep" class="stars">☆</b></div>
    <div class="stat lv" title="레벨">Lv.<b id="lv">1</b><div class="xp"><i id="xpbar"></i></div></div>
    <div class="stat"><b id="clock">1일차 08:00</b></div>
    <div class="stat"><span id="weather">☀ 맑음</span></div>
    <div class="stat"><span id="indoor">실내 0°</span></div>
    <div id="speed" class="seg">
      <button data-speed="0" title="일시정지 (Space)">⏸</button>
      <button data-speed="1" class="on">▶</button>
      <button data-speed="2">▶▶</button>
      <button data-speed="3">▶▶▶</button>
    </div>
    <button id="openBtn" class="btn">☕ 영업 시작</button>
    <button id="musicBtn" class="btn ghost" title="음악 켜기/끄기 (M)">♪</button>
    <button id="menuBtn" class="btn ghost" title="메뉴">☰</button>
  </header>
  <main>
    <section id="stage">
      <div id="banner" hidden></div>
      <div id="canvasWrap">
        <canvas id="world"></canvas>
        <canvas id="fx"></canvas>
      </div>
      <div id="camctl">
        <button id="camShop" class="btn ghost" title="가게 보기">🏠 가게</button>
        <button id="camTown" class="btn ghost" title="마을 전체 보기">🏙 마을</button>
        <button id="zoomOut" class="btn ghost" title="축소">−</button>
        <button id="zoomIn" class="btn ghost" title="확대">＋</button>
      </div>
      <div id="toolbar"><span id="toolHint"></span><button id="cancelTool" class="btn ghost" hidden>선택 해제</button></div>
      <div id="popup" hidden></div>
    </section>
    <aside id="panel">
      <nav id="tabs">
        <button data-tab="utility" class="on">🔧 설비</button>
        <button data-tab="interior">🎨 인테리어</button>
        <button data-tab="ops">☕ 운영</button>
        <button data-tab="shop">🛒 상점</button>
      </nav>
      <div id="panelBody"></div>
    </aside>
  </main>
  <div id="toasts"></div>

  <!-- 1. 모달 팝업 영역 (#modal 안쪽에 modal-content 전체를 포함시킵니다) -->
  <div id="modal" hidden>
    <div class="modal-content" style="background:#222; color:#fff; padding:20px; border-radius:8px; max-width:320px; margin:100px auto; text-align:center;">
      <h3 id="modalTitle">계정 로그인</h3>
      <div style="margin: 10px 0;">
        <input type="email" id="authEmail" placeholder="이메일" style="width:90%; padding:8px; margin-bottom:8px;">
        <input type="password" id="authPassword" placeholder="비밀번호" style="width:90%; padding:8px;">
      </div>
      <div style="display:flex; justify-content:space-around; margin-top:15px;">
        <button id="btnLoginSubmit" class="btn">로그인</button>
        <button id="btnRegisterSubmit" class="btn ghost">회원가입</button>
        <button id="btnCloseModal" class="btn ghost" onclick="closeAuthModal()">닫기</button>
      </div>
    </div>
  </div>
</div>


<!-- 2. Firebase 연동 초기화 파일 -->
<script src="js/firebase-init.js"></script>

<!-- 3. 기존 게임 스크립트 파일들 -->
<script src="assets/manifest.js"></script>
<script src="js/data.js"></script>
<script src="js/naple_atlas.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/town.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
<!-- index.html 하단 -->
<!-- hidden 속성을 추가하여 기본적으로는 숨겨진 상태로 시작하게 만듭니다 -->
<div id="modal" hidden>
  <div class="modal-content">
    ...
  </div>
</div>
