<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>스팀 &amp; 빈즈</title>
<link rel="stylesheet" href="css/style.css">

<!-- Firebase SDK (CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">⚙ 스팀 &amp; 빈즈</div>
    <div class="stat" title="돈"><span id="coinIcon" class="ico"></span><b id="money">0</b></div>
    <div class="stat" title="석탄"><span class="ico">⚫</span><b id="coal">0</b></div>
    <div class="stat" title="평판"><b id="rep" class="stars">☆</b></div>
    <div class="stat lv" title="레벨">Lv.<b id="lv">1</b><div class="xp"><i id="xpbar"></i></div></div>
    <div class="stat"><b id="clock">1일차 08:00</b></div>
    <div class="stat"><span id="weather">☀ 맑음</span></div>
    <div class="stat"><span id="indoor">실내 0°</span></div>
    <div id="speed" class="seg">
      <button data-speed="0" title="일시정지 (Space)">⏸</button>
      <button data-speed="1" class="on">▶</button>
      <button data-speed="2">▶▶</button>
      <button data-speed="3">▶▶▶</button>
    </div>
    <button id="openBtn" class="btn">☕ 영업 시작</button>
    <button id="autoBtn" class="btn ghost" title="자동 운영 켜기/끄기">🤖 자동</button>
    <button id="musicBtn" class="btn ghost" title="음악 켜기/끄기 (M)">♪</button>
    <button id="menuBtn" class="btn ghost" title="메뉴">☰</button>

    <!-- 로그인 상태 영역 -->
    <div id="userAuthArea" style="display: inline-flex; align-items: center; gap: 8px;">
      <button id="authBtn" class="btn ghost" title="계정 로그인" onclick="openAuthModal()">🔒 로그인</button>
      <span id="userEmail" style="font-size: 12px; color: #aaa; display: none;"></span>
      <button id="logoutBtn" class="btn ghost" title="로그아웃" style="display: none;" onclick="logoutAccount()">로그아웃</button>
    </div>
  </header>

  <main>
    <section id="stage">
      <div id="banner" hidden></div>
      <div id="canvasWrap">
        <canvas id="world"></canvas>
        <canvas id="fx"></canvas>
      </div>
      <div id="camctl">
        <button id="panelBtn" class="btn ghost" title="아래 패널 숨기기/보이기">🛠 패널 숨기기</button>
        <button id="camShop" class="btn ghost" title="가게 보기">🏠 가게</button>
        <button id="camTown" class="btn ghost" title="마을 전체 보기">🏙 마을</button>
        <button id="zoomOut" class="btn ghost" title="축소">−</button>
        <button id="zoomIn" class="btn ghost" title="확대">＋</button>
      </div>
      <div id="toolbar"><span id="toolHint"></span><span class="tbtns"><button id="rotTool" class="btn ghost" hidden>⟳ 회전 (R)</button><button id="cancelTool" class="btn ghost" hidden>선택 해제</button></span></div>
      <div id="popup" hidden></div>
      <div id="tutorial" hidden></div>
    </section>
    <aside id="panel">
      <nav id="tabs">
        <button data-tab="utility" class="on">🔧 설비</button>
        <button data-tab="interior">🎨 인테리어</button>
        <button data-tab="ops">☕ 운영</button>
        <button data-tab="shop">🛒 상점</button>
      </nav>
      <div id="panelBody"></div>
    </aside>
  </main>
  <div id="toasts"></div>
  <div id="modal" hidden></div>
</div>

<!-- 계정 인증 전용 모달 (독립형 id: authModal 사용) -->
<div id="authModal" hidden style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 999999; background: #222; color: #fff; padding: 20px; border-radius: 12px; width: 260px; text-align: center; border: 1px solid #555; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
  <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 16px;">계정 로그인</h3>
  <div style="margin-bottom: 12px;">
    <input type="email" id="authEmail" placeholder="이메일" style="width: 100%; padding: 8px; margin-bottom: 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff;">
    <input type="password" id="authPassword" placeholder="비밀번호" style="width: 100%; padding: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff;">
  </div>
  <div style="display: flex; justify-content: space-between; gap: 6px;">
    <button id="btnLoginSubmit" class="btn" style="flex: 1;" onclick="handleLogin()">로그인</button>
    <button id="btnRegisterSubmit" class="btn ghost" style="flex: 1;" onclick="handleRegister()">회원가입</button>
    <button id="btnCloseModal" class="btn ghost" style="flex: 1;" onclick="closeAuthModal()">닫기</button>
  </div>
</div>

<!-- 기존 게임 엔진 스크립트 먼저 실행 -->
<script src="assets/manifest.js"></script>
<script src="js/data.js"></script>
<script src="js/naple_atlas.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/town.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>

<!-- 파이어베이스 초기화 스크립트는 게임 로드 후 맨 나중에 실행 -->
<script src="js/firebase-init.js"></script>
</body>
</html>
